name: Dry-run verification

# Verifies every code change end-to-end on a fresh stack with DRY_RUN=true — never publishes and
# never touches production state. Live publishing runs in production.yml.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/daily-dry-run.yml"
      - "docker-compose.yml"
      - "db/**"
      - "services/**"
      - "scripts/**"
      - "n8n/workflows/**"
      - "config/**"
      - "!config/schedule.json"

permissions:
  contents: read
  actions: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: daily-dry-run
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests (schedule, queue, duplicate prevention, GitHub sync)
        run: |
          python3 scripts/test_schedule_queue.py
          python3 scripts/validate_workflows.py

      - name: Create runtime .env
        env:
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          N8N_OWNER_PASSWORD: ${{ secrets.N8N_OWNER_PASSWORD }}
          N8N_OWNER_EMAIL: ${{ secrets.N8N_OWNER_EMAIL }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: |
          set -euo pipefail
          if [ -z "${N8N_ENCRYPTION_KEY}" ]; then
            echo "Missing secret N8N_ENCRYPTION_KEY"
            exit 1
          fi
          if [ -z "${N8N_OWNER_PASSWORD}" ]; then
            echo "Missing secret N8N_OWNER_PASSWORD"
            exit 1
          fi
          EMAIL="${N8N_OWNER_EMAIL:-admin@localhost.local}"
          FOLDER="${GOOGLE_DRIVE_FOLDER_ID:-1MU6xHdcI18mCbDsp1IxAyA9YoDfeRQKD}"
          # Prefer GitHub secret; fall back to the Anikaza "configured" board id for dry-run CI.
          PIN_BOARD="${PINTEREST_BOARD_ID:-1074601229777946521}"
          cat > .env <<EOF
          N8N_HOST=localhost
          N8N_PORT=5678
          N8N_PROTOCOL=http
          WEBHOOK_URL=http://localhost:5678/
          GENERIC_TIMEZONE=Asia/Kolkata
          TZ=Asia/Kolkata
          N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
          N8N_SECURE_COOKIE=false
          N8N_BLOCK_ENV_ACCESS_IN_NODE=false
          N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
          N8N_RESTRICT_FILE_ACCESS_TO=/data
          N8N_OWNER_EMAIL=${EMAIL}
          N8N_OWNER_FIRST_NAME=Store
          N8N_OWNER_LAST_NAME=Admin
          N8N_OWNER_PASSWORD=${N8N_OWNER_PASSWORD}
          DRY_RUN=true
          USE_SAMPLE_MEDIA=false
          SCHEDULER_ENABLED=false
          GOOGLE_DRIVE_FOLDER_ID=${FOLDER}
          DRIVE_ACCESS_MODE=public
          META_GRAPH_VERSION=v22.0
          YOUTUBE_PRIVACY_STATUS=private
          YOUTUBE_OAUTH_CLIENT_ID=${YOUTUBE_OAUTH_CLIENT_ID}
          YOUTUBE_OAUTH_CLIENT_SECRET=${YOUTUBE_OAUTH_CLIENT_SECRET}
          PINTEREST_BOARD_ID=${PIN_BOARD}
          INCLUDE_WEBSITE_URL=false
          AI_PROVIDER=gemini
          GEMINI_MODEL=gemini-3.6-flash
          GEMINI_HOST=https://generativelanguage.googleapis.com
          GEMINI_API_KEY=${GEMINI_API_KEY}
          AI_FALLBACK_PROVIDER=groq
          GROQ_MODEL=qwen/qwen3.8-27b
          TRACKING_API_PORT=8081
          EOF
          # Strip leading spaces from heredoc indentation
          sed -i 's/^[[:space:]]*//' .env
          mkdir -p data/db data/media data/previews data/logs data/backups
          touch data/media/.gitkeep data/previews/.gitkeep data/logs/.gitkeep data/backups/.gitkeep data/db/.gitkeep

      - name: Start stack (tracking-api + n8n)
        run: docker compose up -d --build tracking-api n8n

      - name: Wait for health
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null && curl -fsS http://127.0.0.1:5678/healthz >/dev/null; then
              echo "Health endpoints OK — waiting for n8n REST warm-up"
              sleep 20
              exit 0
            fi
            echo "Waiting ($i)..."
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color --tail=80
          exit 1

      - name: Import n8n workflows + credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
        run: |
          # Same AI setup as production: Gemini primary, Groq fallback (one call per product).
          for v in GEMINI_API_KEY GROQ_API_KEY; do
            [ -n "${!v}" ] || { echo "::error::secret $v is missing — the Gemini → Groq fallback cannot be verified"; exit 1; }
          done
          python3 scripts/import_workflows.py

      - name: Verify daily dry-run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          N8N_OWNER_EMAIL: ${{ secrets.N8N_OWNER_EMAIL }}
          N8N_OWNER_PASSWORD: ${{ secrets.N8N_OWNER_PASSWORD }}
          CI_RUN_E2E: "true"
        run: |
          export N8N_OWNER_EMAIL="${N8N_OWNER_EMAIL:-admin@localhost.local}"
          python3 scripts/ci_daily_run.py
          python3 scripts/test_dry_run.py
          python3 scripts/test_youtube_readiness.py

      - name: Verify dashboard + schedule endpoints
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8081/dashboard | grep -q "Schedule settings"
          curl -fsS http://127.0.0.1:8081/schedule | python3 -c "import json,sys; s=json.load(sys.stdin); want=json.load(open('config/schedule.json'))['publish_times']; assert s['publish_times']==want, s; print('schedule', s['publish_times'], s['timezone'], 'next', [u['slot'] for u in s['upcoming'][:6]])"
          curl -fsS http://127.0.0.1:8081/queue | python3 -c "import json,sys; q=json.load(sys.stdin); print('queue', [r['product_id'] for r in q['active']], 'size', q['queue_size'])"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down
